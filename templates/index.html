<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Daily World Brief — resumen diario de noticias: economía, política y tecnología en Asia, Europa y América. Cada noticia en su idioma original.">
<title>Daily World Brief</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate" type="application/rss+xml" title="Daily World Brief" href="feed.xml">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280;
  --accent:#2563eb; --border:#e5e7eb; --chip:#eef2f7;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --card:#181b21; --text:#e7e9ec; --muted:#9aa1ab;
         --accent:#7aa2ff; --border:#262b33; --chip:#222731; }
}
*{box-sizing:border-box; margin:0}
body{background:var(--bg); color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:1px solid var(--border); padding:.6rem .9rem}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:.5rem;
  max-width:760px; margin:0 auto}
h1{font-size:1.05rem; letter-spacing:.02em; white-space:nowrap}
h1 span{color:var(--accent)}
.controls{display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; justify-content:flex-end}
select, .filt{background:var(--chip); color:var(--text); border:1px solid var(--border);
  border-radius:.55rem; padding:.32rem .5rem; font-size:.85rem; cursor:pointer}
.filt{min-width:2.4rem; opacity:.5}
.filt.on{opacity:1; background:var(--accent); color:#fff; border-color:var(--accent)}
main{max-width:760px; margin:0 auto; padding:0 .9rem 3rem}
.market{display:flex; gap:.6rem; overflow-x:auto; padding:.7rem 0 .2rem; font-size:.8rem;
  scrollbar-width:none}
.market::-webkit-scrollbar{display:none}
.mkt{background:var(--card); border:1px solid var(--border); border-radius:.6rem;
  padding:.3rem .6rem; white-space:nowrap; color:var(--muted)}
.mkt b{color:var(--text); font-variant-numeric:tabular-nums}
.section{margin-top:1.4rem}
.section>h2{font-size:1.15rem; padding-bottom:.35rem; border-bottom:2px solid var(--accent)}
.continent{margin-top:.9rem}
.continent>h3{font-size:.8rem; text-transform:uppercase; letter-spacing:.12em;
  color:var(--muted); margin-bottom:.5rem}
.card{background:var(--card); border:1px solid var(--border); border-radius:.8rem;
  padding:.8rem .9rem; margin-bottom:.6rem}
.card h4{font-size:.98rem; line-height:1.4; margin-bottom:.3rem}
.card h4 a{color:inherit; text-decoration:none}
.card h4 a:hover{color:var(--accent)}
.card p{font-size:.9rem; opacity:.92; margin-bottom:.45rem}
.meta{font-size:.78rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.25rem .5rem;
  align-items:center}
.meta a{color:var(--accent); text-decoration:none; font-weight:600}
.meta a:hover{text-decoration:underline}
.tag{background:var(--chip); border:1px solid var(--border); border-radius:.35rem;
  padding:0 .3rem; font-size:.7rem; letter-spacing:.03em}
.empty{color:var(--muted); font-size:.85rem; padding:.4rem 0}
footer{max-width:760px; margin:2.2rem auto 0; padding:1rem .9rem 2rem; font-size:.78rem;
  color:var(--muted); border-top:1px solid var(--border)}
footer a{color:var(--accent)}
.warn{margin-top:.3rem}
@media(min-width:640px){
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.9rem}
  .continent{margin-top:0}
  .section .grid{margin-top:.9rem}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Daily <span>World</span> Brief</h1>
    <div class="controls">
      <select id="dateSel" aria-label="Fecha"></select>
      <button class="filt on" data-lang="es" title="Mostrar noticias en español">ES</button>
      <button class="filt on" data-lang="en" title="Mostrar noticias en inglés">EN</button>
      <button class="filt on" data-lang="zh" title="显示中文新闻">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="market" id="market"></div>
  <div id="content"></div>
</main>
<footer id="footer"></footer>

<script type="application/json" id="brief-data">__BRIEF_JSON__</script>
<script type="application/json" id="dates-data">__DATES_JSON__</script>
<script>
"use strict";
const SECTIONS = {
  economia:  "Economía",
  politica:  "Política y Geopolítica",
  tecnologia:"Tecnología e IA",
};
const CONTINENTS = { asia:"Asia", europa:"Europa", america:"América" };
const LANG_TAG = { es:"ES", en:"EN", zh:"中文" };

let brief = JSON.parse(document.getElementById("brief-data").textContent);
const dates = JSON.parse(document.getElementById("dates-data").textContent);
let active = new Set(JSON.parse(localStorage.getItem("dwb-langs") || '["es","en","zh"]'));
if (!active.size) active = new Set(["es","en","zh"]);

function fmtTime(iso){
  if(!iso) return "";
  try{
    return new Date(iso).toLocaleString("es", {hour:"2-digit", minute:"2-digit",
      day:"numeric", month:"short"});
  }catch(e){ return ""; }
}
function esc(s){ const d=document.createElement("span"); d.textContent=s||""; return d.innerHTML; }

function render(){
  document.querySelectorAll(".filt").forEach(b=>
    b.classList.toggle("on", active.has(b.dataset.lang)));

  const mkt = document.getElementById("market");
  mkt.innerHTML = "";
  if (brief.market){
    for (const k of Object.keys(brief.market)){
      const m = brief.market[k];
      mkt.innerHTML += `<div class="mkt">${esc(m.label)} <b>${m.price.toLocaleString(
        "es",{maximumFractionDigits:4})}</b></div>`;
    }
  }

  const root = document.getElementById("content");
  root.innerHTML = "";
  let shown = 0;
  for (const sec of Object.keys(SECTIONS)){
    let html = `<section class="section"><h2>${SECTIONS[sec]}</h2><div class="grid">`;
    for (const cont of Object.keys(CONTINENTS)){
      const all = (brief.cells && brief.cells[`${sec}|${cont}`]) || [];
      const items = all.filter(it => active.has(it.lang || "en"));
      shown += items.length;
      html += `<div class="continent"><h3>${CONTINENTS[cont]}</h3>`;
      if (!items.length)
        html += `<div class="empty">${all.length ? "Sin noticias en los idiomas elegidos."
                                                 : "Sin noticias destacadas hoy."}</div>`;
      for (const it of items){
        html += `<article class="card">
          <h4><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h4>
          ${it.summary ? `<p>${esc(it.summary)}</p>` : ""}
          <div class="meta">
            <span class="tag">${LANG_TAG[it.lang] || "EN"}</span>
            <a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.source)}</a>
            <span>${fmtTime(it.published)}</span>
          </div></article>`;
      }
      html += `</div>`;
    }
    root.innerHTML += html + "</div></section>";
  }

  const f = document.getElementById("footer");
  let foot = `${shown} noticias · Generado: ${fmtTime(brief.generated_at)} UTC · `
           + `<a href="feed.xml">Suscríbete por RSS</a>`;
  if (brief.mode === "headlines-only")
    foot += `<div class="warn">⚠️ Modo reducido: hoy solo titulares (falló el resumen automático).</div>`;
  if (brief.failed_sources && brief.failed_sources.length)
    foot += `<div class="warn">${brief.failed_sources.length} fuentes no disponibles hoy `
          + `(${esc(brief.failed_sources.join(", "))})</div>`;
  f.innerHTML = foot;
}

const sel = document.getElementById("dateSel");
dates.forEach(d=>{
  const o = document.createElement("option");
  o.value = d; o.textContent = d;
  sel.appendChild(o);
});
sel.value = brief.date;
sel.addEventListener("change", async ()=>{
  try{
    const r = await fetch(`data/${sel.value}.json`, {cache:"no-cache"});
    if (r.ok){ brief = await r.json(); render(); }
  }catch(e){ /* sin conexión: se mantiene el brief actual */ }
});

document.querySelectorAll(".filt").forEach(b=>
  b.addEventListener("click", ()=>{
    const l = b.dataset.lang;
    active.has(l) ? active.delete(l) : active.add(l);
    if (!active.size) active = new Set(["es","en","zh"]);   // nunca vacío
    localStorage.setItem("dwb-langs", JSON.stringify([...active]));
    render();
  }));

render();

if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>

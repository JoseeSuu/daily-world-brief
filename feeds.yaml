# Fuentes del Daily World Brief.
# Cada entrada: name, url, section (economia|politica|tecnologia),
# continent (asia|europa|america|global), lang (idioma del feed).
# "global" = el feed cubre varios continentes; la IA asigna cada noticia a su continente.
# Verificado por última vez: 2026-08-09. Ejecuta `python scripts/collect.py --check` para revalidar.
#
# Descartados por no tener RSS público operativo hoy:
#   Caixin Global (404), FMI (403 anti-bot), AP News (retiró RSS), NHK World EN (404),
#   Anthropic blog (sin RSS), Banco Mundial / BIS / OECD (403 o sin feed),
#   36Kr / Sina Tech / 聯合早報 / 香港01 / 數位時代 / PingWest (404 o feed muerto).
#
# IT之家 se retiró aunque su feed funciona: rechaza las IPs de GitHub Actions
# (ConnectionError en CI), así que fallaba cada día en producción. Las fuentes
# en chino son de Taiwán, Hong Kong o internacionales por ese motivo.

feeds:
  # ── Economía ─────────────────────────────────────────────

name: Daily brief
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Evaluate archived editions without publishing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/evaluate_events.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-evaluation
          path: evaluation/
